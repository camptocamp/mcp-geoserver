<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org" lang="en">
<head><title>MCP Server</title></head>
<body>
<wicket:extend>
  <form wicket:id="form">
    <fieldset>
      <legend><wicket:message key="McpAdminPage.legend">MCP Server</wicket:message></legend>
      <ul>
        <li>
          <strong><wicket:message key="McpAdminPage.endpoint">Endpoint</wicket:message></strong>
          <span wicket:id="endpoint"></span>
        </li>
        <li>
          <input type="checkbox" wicket:id="enabled" id="mcpEnabled"/>
          <label for="mcpEnabled"><wicket:message key="McpAdminPage.enabled">Enabled</wicket:message></label>
        </li>
        <li>
          <input type="checkbox" wicket:id="verbose" id="mcpVerbose"/>
          <label for="mcpVerbose"><wicket:message key="McpAdminPage.verbose">Verbose: include equivalent curl commands in results</wicket:message></label>
        </li>
        <li>
          <input type="checkbox" wicket:id="readOnly" id="mcpReadOnly"/>
          <label for="mcpReadOnly"><wicket:message key="McpAdminPage.readOnly">Read-only: only tools that change nothing can be called</wicket:message></label>
        </li>
        <li>
          <label for="mcpMaxListResults"><wicket:message key="McpAdminPage.maxListResults">Maximum items per list in a result</wicket:message></label>
          <input type="number" wicket:id="maxListResults" id="mcpMaxListResults" size="8"/>
        </li>
        <li>
          <label for="mcpMaxFeatures"><wicket:message key="McpAdminPage.maxFeatures">Maximum features returned by gs_query_features</wicket:message></label>
          <input type="number" wicket:id="maxFeatures" id="mcpMaxFeatures" size="8"/>
        </li>
        <li>
          <label for="mcpNewRole"><wicket:message key="McpAdminPage.allowedRoles">Allowed roles (comma separated)</wicket:message></label>
          <ul>
            <li wicket:id="roles">
              <span wicket:id="role"></span>
              <button type="submit" wicket:id="remove" class="btn btn-sm" title="Remove">&#215;</button>
            </li>
          </ul>
          <select wicket:id="newRole" id="mcpNewRole"></select>
          <button type="submit" wicket:id="addRole" class="btn btn-sm" title="Add role">+</button>
        </li>
        <li>
          <label for="mcpInternalBaseUrl"><wicket:message key="McpAdminPage.internalBaseUrl">Internal base URL for WMS and GWC calls (optional)</wicket:message></label>
          <input type="text" wicket:id="internalBaseUrl" id="mcpInternalBaseUrl" size="60"/>
        </li>
      </ul>
    </fieldset>
    <button type="submit" wicket:id="submit" class="btn btn-primary"><wicket:message key="McpAdminPage.submit">Save</wicket:message></button>
  </form>
</wicket:extend>
</body>
</html>
