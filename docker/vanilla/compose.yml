services:
  geoserver:
    image: docker.osgeo.org/geoserver:3.0.1
    ports:
      - "8080:8080"
    environment:
      SKIP_DEMO_DATA: "false"
      EXTRA_JAVA_OPTS: "-Xms256m -Xmx1g"
      PROXY_BASE_URL: "http://localhost:8080/geoserver"
    volumes:
      # jars here are copied into WEB-INF/lib by the image entrypoint (ADDITIONAL_LIBS_DIR)
      - ./additional_libs:/opt/additional_libs:ro
      - geoserver_data:/opt/geoserver_data
    healthcheck:
      test: ["CMD", "curl", "-fs", "-u", "admin:geoserver", "http://localhost:8080/geoserver/rest/about/version.json"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  geoserver_data:
