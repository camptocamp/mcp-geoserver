name: Security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Secrets are absent on Dependabot and fork PRs.
      - name: Snyk dependency test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/maven-3-jdk-17@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: test
          args: --maven-aggregate-project --severity-threshold=high

  # Snyk-independent CVE gate: scans the app dependencies against the OSV database (osv.dev).
  # No API key, no vulnerability DB download. Runs with or without a token, so it still gates
  # Dependabot and fork PRs where SNYK_TOKEN is absent.
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate CycloneDX SBOM
        # Aggregate BOM over all modules; provided scope (GeoServer/GeoTools/Spring, shipped by the
        # host) and test scope are excluded in pom.xml, so only bundled/app deps are scanned.
        run: ./mvnw -q -B -ntp -DskipTests cyclonedx:makeAggregateBom
      - name: Scan SBOM against OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            --lockfile=./target/bom.json
