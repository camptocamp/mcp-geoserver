name: Security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Secrets are absent on Dependabot and fork PRs.
      - name: Snyk dependency test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/maven-3-jdk-17@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: test
          args: --maven-aggregate-project --severity-threshold=high

  # Snyk-independent CVE gate: scans the resolved Maven dependencies against the NVD.
  # Runs with or without a token, so it still gates Dependabot and fork PRs where SNYK_TOKEN is absent.
  owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # NVD mirror is large and slow to build; reuse it across runs.
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd
      - name: OWASP dependency-check
        # No nvdApiKey means NVD rate-limits the first sync hard; set the NVD_API_KEY secret to speed it up.
        run: >
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.1.0:aggregate
          -DfailBuildOnCVSS=7
          -DskipProvidedScope=true
          -DnvdApiKey="${{ secrets.NVD_API_KEY }}"
          -Dformats=HTML
          -DdataDirectory="$HOME/.m2/repository/org/owasp/dependency-check-data"
